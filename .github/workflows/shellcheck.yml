name: ShellCheck

on:
  push:
    paths: ["**.sh", "**.command", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["**.sh", "**.command", ".github/workflows/shellcheck.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck -x --severity=style *.sh *.command
